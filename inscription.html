<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fiche d'inscription</title>

    <link rel="stylesheet" href="inscription.css">
</head>

<body>

    <div class="container">

        <div class="formulaire">

            <h1>Fiche d'inscription</h1>

            <p class="description">
                Veuillez remplir le formulaire pour créer votre compte.
            </p>

            <form id="inscriptionForm">

                <!-- Nom -->
                <div class="champ">
                    <label for="nom">Nom</label>

                    <input
                        type="text"
                        id="nom"
                        name="nom"
                        placeholder="Entrez votre nom"
                        required
                    >
                </div>

                <!-- Prénom -->
                <div class="champ">
                    <label for="prenom">Prénom</label>

                    <input
                        type="text"
                        id="prenom"
                        name="prenom"
                        placeholder="Entrez votre prénom"
                        required
                    >
                </div>

                <!-- Email -->
                <div class="champ">
                    <label for="email">Adresse e-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="prince@gmail.com"
                        required
                    >
                </div>

                <!-- Mot de passe -->
                <div class="champ">
                    <label for="password">Mot de passe</label>

                    <div class="password-container">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Entrez votre mot de passe"
                            required
                            minlength="6"
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                            aria-label="Afficher le mot de passe"
                        >
                            👁️
                        </button>
                    </div>
                </div>
                <!-- Filière -->
                <div class="champ">

                    <label for="filiere">Filière</label>

                    <select id="filiere" name="filiere" required>

                        <option value="">
                            -- Choisissez votre filière --
                        </option>

                        <option value="1">
                            INS
                        </option>

                        <option value="2">
                            ISN
                        </option>

                        <option value="3">
                            CDN
                        </option>

                    </select>

                </div>

                <!-- Niveau -->
                <div class="champ">

                    <label for="niveau">Niveau d'étude</label>

                    <select id="niveau" name="niveau" required>

                        <option value="">
                            -- Choisissez votre niveau --
                        </option>

                        <option value="1">
                            1ère année
                        </option>

                        <option value="2">
                            2ème année
                        </option>


                    </select>

                </div>

                <!-- Message -->
                <p id="message"></p>

                <!-- Boutons -->
                <div class="boutons">

                    <button
                        type="submit"
                        class="btn-inscription"
                    >
                        S'inscrire
                    </button>

                    <button
                        type="reset"
                        class="btn-reset"
                    >
                        Réinitialiser
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- ============================
         JAVASCRIPT API
    ============================= -->

    <script>

        const inscriptionForm =
            document.getElementById("inscriptionForm");

        const message =
            document.getElementById("message");

        const passwordInput =
            document.getElementById("password");

        const togglePassword =
            document.getElementById("togglePassword");

        const boutonInscription =
            document.querySelector(".btn-inscription");


        /* ============================
        AFFICHER / MASQUER MOT DE PASSE
        ============================ */

        togglePassword.addEventListener(
            "click",
            function() {

                if (passwordInput.type === "password") {

                    passwordInput.type = "text";

                    togglePassword.textContent = "🙈";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Masquer le mot de passe"
                    );

                } else {

                    passwordInput.type = "password";

                    togglePassword.textContent = "👁️";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Afficher le mot de passe"
                    );
                }

            }
        );


        /* ============================
        SOUMISSION DU FORMULAIRE
        ============================ */

        inscriptionForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                // Empêche les doubles clics
                if (boutonInscription.disabled) {
                    return;
                }


                // ============================
                // RÉCUPÉRATION DES DONNÉES
                // ============================

                const nom =
                    document.getElementById("nom")
                        .value
                        .trim();

                const prenom =
                    document.getElementById("prenom")
                        .value
                        .trim();

                const email =
                    document.getElementById("email")
                        .value
                        .trim();

                const password =
                    document.getElementById("password")
                        .value;

                const filiere_id =
                    Number(
                        document.getElementById("filiere")
                            .value
                    );

                const niveau_id =
                    Number(
                        document.getElementById("niveau")
                            .value
                    );


                // ============================
                // VALIDATION
                // ============================

                if (!nom) {

                    message.textContent =
                        "Veuillez entrer votre nom.";

                    return;
                }


                if (!prenom) {

                    message.textContent =
                        "Veuillez entrer votre prénom.";

                    return;
                }


                if (!email) {

                    message.textContent =
                        "Veuillez entrer votre adresse e-mail.";

                    return;
                }


                if (!password) {

                    message.textContent =
                        "Veuillez entrer un mot de passe.";

                    return;
                }


                if (password.length < 6) {

                    message.textContent =
                        "Le mot de passe doit contenir au moins 6 caractères.";

                    return;
                }


                if (!filiere_id) {

                    message.textContent =
                        "Veuillez choisir votre filière.";

                    return;
                }


                if (!niveau_id) {

                    message.textContent =
                        "Veuillez choisir votre niveau d'étude.";

                    return;
                }


                // ============================
                // DONNÉES ENVOYÉES AU BACKEND
                // ============================

                const donnees = {

                    nom: nom,

                    prenom: prenom,

                    email: email,

                    password: password,

                    filiere_id: filiere_id,

                    niveau_id: niveau_id

                };


                // Désactiver le bouton
                boutonInscription.disabled = true;

                boutonInscription.textContent =
                    "Inscription...";


                try {

                    const response =
                        await fetch(
                            "https://la-collecte-backend.onrender.com/users",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(donnees)

                            }
                        );


                    const resultat =
                        await response.json();


                    // ============================
                    // INSCRIPTION RÉUSSIE
                    // ============================

                    if (response.ok) {

                        message.textContent =
                            resultat.message ||
                            "Inscription réussie !";


                        localStorage.setItem(
                            "access_token",
                            resultat.access_token
                        );

                        localStorage.setItem(
                            "role_id",
                            resultat.role_id
                        );


                        inscriptionForm.reset();


                        const pageRetour =
                            localStorage.getItem(
                                "page_apres_connexion"
                            );


                        if (pageRetour) {

                            localStorage.removeItem(
                                "page_apres_connexion"
                            );


                            setTimeout(function() {

                                window.location.href =
                                    pageRetour;

                            }, 500);

                        } else {

                            setTimeout(function() {

                                window.location.href =
                                    "index.html";

                            }, 500);
                        }

                        return;
                    }


                    // ============================
                    // ERREUR DU BACKEND
                    // ============================

                    if (resultat.detail) {

                        if (
                            Array.isArray(resultat.detail)
                        ) {

                            message.textContent =
                                resultat.detail
                                    .map(
                                        erreur =>
                                            erreur.msg
                                    )
                                    .join(", ");

                        } else {

                            message.textContent =
                                resultat.detail;
                        }

                    } else {

                        message.textContent =
                            "Une erreur est survenue.";
                    }


                    // Réactiver le bouton

                    boutonInscription.disabled = false;

                    boutonInscription.textContent =
                        "S'inscrire";


                } catch (erreur) {

                    console.error(erreur);

                    message.textContent =
                        "Impossible de contacter le serveur.";


                    boutonInscription.disabled = false;

                    boutonInscription.textContent =
                        "S'inscrire";
                }

            }
        );

    </script>

</body>
</html>
