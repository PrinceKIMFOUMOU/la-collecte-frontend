<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion</title>

    <link rel="stylesheet" href="connexion.css">

</head>


<body>

    <div class="container">

        <div class="formulaire">

            <h1>Connexion</h1>

            <p class="description">
                Connectez-vous à votre compte.
            </p>


            <form id="connexionForm">

                <!-- Email -->
                <div class="champ">

                    <label for="email">
                        Adresse e-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder=prince@gmail.com"
                        required
                    >

                </div>


                <!-- Mot de passe -->
                <div class="champ">

                    <label for="password">
                        Mot de passe
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Entrez votre mot de passe"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                            aria-label="Afficher le mot de passe"
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <!-- Message -->
                <p id="message"></p>


                <!-- Bouton -->
                <div class="boutons">

                    <button
                        type="submit"
                        class="btn-connexion"
                    >
                        Se connecter
                    </button>

                </div>


                <!-- Lien inscription -->
                <p class="inscription-link">

                    Vous n'avez pas encore de compte ?

                    <a href="inscription.html">
                        S'inscrire
                    </a>

                </p>

            </form>

        </div>

    </div>


    <!-- ============================
         JAVASCRIPT
    ============================= -->

    <script>

        const connexionForm =
            document.getElementById("connexionForm");

        const message =
            document.getElementById("message");

        const passwordInput =
            document.getElementById("password");

        const togglePassword =
            document.getElementById("togglePassword");

        const boutonConnexion =
            document.querySelector(".btn-connexion");


        /* ============================
        AFFICHER / MASQUER MOT DE PASSE
        ============================ */

        togglePassword.addEventListener(
            "click",
            function() {

                if (passwordInput.type === "password") {

                    passwordInput.type = "text";

                    togglePassword.textContent = "🙈";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Masquer le mot de passe"
                    );

                } else {

                    passwordInput.type = "password";

                    togglePassword.textContent = "👁️";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Afficher le mot de passe"
                    );
                }

            }
        );


        /* ============================
        SOUMISSION DU FORMULAIRE
        ============================ */

        connexionForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                // Empêche les doubles clics
                if (boutonConnexion.disabled) {
                    return;
                }


                // ============================
                // RÉCUPÉRATION DES DONNÉES
                // ============================

                const email =
                    document.getElementById("email")
                        .value
                        .trim();

                const password =
                    document.getElementById("password")
                        .value;


                // ============================
                // VALIDATION
                // ============================

                if (!email) {

                    message.textContent =
                        "Veuillez entrer votre adresse e-mail.";

                    return;
                }


                if (!password) {

                    message.textContent =
                        "Veuillez entrer votre mot de passe.";

                    return;
                }


                // ============================
                // DÉSACTIVATION DU BOUTON
                // ============================

                boutonConnexion.disabled = true;

                boutonConnexion.textContent =
                    "Connexion...";


                try {

                    const response =
                        await fetch(
                            "https://la-collecte-backend.onrender.com/login",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        email: email,

                                        password: password

                                    })

                            }
                        );


                    const resultat =
                        await response.json();


                    // ============================
                    // ERREUR DE CONNEXION
                    // ============================

                    if (!response.ok) {

                        message.textContent =
                            resultat.detail ||
                            "Email ou mot de passe incorrect.";


                        boutonConnexion.disabled =
                            false;

                        boutonConnexion.textContent =
                            "Se connecter";

                        return;
                    }


                    // ============================
                    // CONNEXION RÉUSSIE
                    // ============================

                    localStorage.setItem(
                        "access_token",
                        resultat.access_token
                    );

                    localStorage.setItem(
                        "role_id",
                        resultat.role_id
                    );


                    message.textContent =
                        "Connexion réussie !";


                    // ============================
                    // REDIRECTION SELON LE RÔLE
                    // ============================

                    setTimeout(function() {

                        if (resultat.role_id === 2) {

                            window.location.href =
                                "admin.html";

                        } else {

                            window.location.href =
                                "index.html";
                        }

                    }, 500);


                } catch (erreur) {

                    console.error(erreur);

                    message.textContent =
                        "Impossible de contacter le serveur.";


                    boutonConnexion.disabled =
                        false;

                    boutonConnexion.textContent =
                        "Se connecter";
                }

            }
        );
    </script>
</body>

</html>
