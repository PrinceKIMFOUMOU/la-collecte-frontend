<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion</title>

    <link rel="stylesheet" href="connexion.css">

</head>


<body>

    <div class="container">

        <div class="formulaire">

            <h1>Connexion</h1>

            <p class="description">
                Connectez-vous à votre compte.
            </p>


            <form id="connexionForm">

                <!-- Email -->
                <div class="champ">

                    <label for="email">
                        Adresse e-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder=prince@gmail.com"
                        required
                    >

                </div>


                <!-- Mot de passe -->
                <div class="champ">

                    <label for="password">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Entrez votre mot de passe"
                        required
                    >

                </div>


                <!-- Message -->
                <p id="message"></p>


                <!-- Bouton -->
                <div class="boutons">

                    <button
                        type="submit"
                        class="btn-connexion"
                    >
                        Se connecter
                    </button>

                </div>


                <!-- Lien inscription -->
                <p class="inscription-link">

                    Vous n'avez pas encore de compte ?

                    <a href="inscription.html">
                        S'inscrire
                    </a>

                </p>

            </form>

        </div>

    </div>


    <!-- ============================
         JAVASCRIPT
    ============================= -->

    <script>

        const connexionForm =
            document.getElementById("connexionForm");

        const message =
            document.getElementById("message");


        connexionForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document.getElementById("email")
                        .value
                        .trim();

                const password =
                    document.getElementById("password")
                        .value;


                if (!email || !password) {

                    message.textContent =
                        "Veuillez remplir tous les champs.";

                    return;
                }


                try {

                    const response =
                        await fetch(
                            "https://la-collecte-backend.onrender.com/login",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    email: email,

                                    password: password

                                })

                            }
                        );


                    const resultat =
                        await response.json();


                    if (!response.ok) {

                        message.textContent =
                            resultat.detail ||
                            "Email ou mot de passe incorrect.";

                        return;
                    }


                    // Enregistrement du JWT
                    localStorage.setItem(
                        "access_token",
                        resultat.access_token
                    );


                    // Enregistrement du rôle
                    localStorage.setItem(
                        "role_id",
                        resultat.role_id
                    );


                    message.textContent =
                        "Connexion réussie !";


                    // Redirection selon le rôle
                    setTimeout(function() {

                        if (resultat.role_id === 2) {

                            // Administrateur
                            window.location.href =
                                "admin.html";

                        } else {

                            // Étudiant
                            window.location.href =
                                "index.html";

                        }

                    }, 500);


                } catch (erreur) {

                    console.error(erreur);

                    message.textContent =
                        "Impossible de contacter le serveur.";

                }

            }
        );

    </script>
</body>

</html>
